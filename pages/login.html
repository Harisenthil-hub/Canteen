<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../images/icons/logo.png">
    <link rel="stylesheet" href="../styles/styles.css">


    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aguafina+Script&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Poppins&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="../images/background.png" alt="Amrita">
            <div class="logo-desktop">
                <img src="../images/icons/amrita-full.svg" alt="logo">
            </div>
            
        </div>
        

        <div class="form-box">
            <h2>Login</h2>
            <form>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <div class="toggle">
                <p id="toggle-text">Don't have an account? <a href="./signup.html">SignUp</a></p>
            </div>
        </div>
        
    </div>
    
</body>
</html>
